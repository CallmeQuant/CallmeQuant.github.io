---
layout: default
---
<article class="note">
  <header class="note-head">
    <h1>{{ page.title }}</h1>
    <p class="note-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% if page.topic %}<span class="topic">{{ page.topic }}</span>{% endif %}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <nav class="note-nav" aria-label="More notes">
    {% if page.previous %}<a class="prev" href="{{ page.previous.url | relative_url }}"><span>Earlier</span>{{ page.previous.title }}</a>{% endif %}
    {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}"><span>Later</span>{{ page.next.title }}</a>{% endif %}
  </nav>
</article>
