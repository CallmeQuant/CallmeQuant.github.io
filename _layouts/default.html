<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
{% include head.html %}
<body class="{% if page.url == '/' %}is-home{% endif %}">
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">Binh Ho</a>
    <nav aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/papers/' | relative_url }}"{% if page.url == '/papers/' %} aria-current="page"{% endif %}>Papers</a>
      <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes/' %} aria-current="page"{% endif %}>Notes</a>
      <a href="{{ '/files/Resume_BinhHo_2024_v2.pdf' | relative_url }}">CV</a>
    </nav>
  </header>

  <main id="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      <a href="mailto:{{ site.author.email }}">Email</a>
      <a href="https://github.com/{{ site.author.github }}">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/">LinkedIn</a>
      <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
    </p>
    <p class="fine">&copy; {{ 'now' | date: '%Y' }} Binh Ho. Figures on this site are generated by the code in the <a href="https://github.com/{{ site.author.github }}/{{ site.author.github }}.github.io/tree/main/figures">figures</a> directory.</p>
  </footer>
</body>
</html>
