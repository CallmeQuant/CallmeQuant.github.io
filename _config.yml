title: Binh Ho
description: >-
  PhD student in Mathematical Statistics at the University of Maryland,
  College Park. Notes on probability, statistical theory, and computation.
url: https://callmequant.github.io
baseurl: ""
lang: en

author:
  name: Binh Ho
  email: binhho660@gmail.com
  github: CallmeQuant
  linkedin: binh-ho-899390193

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

permalink: /notes/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - figures
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .idea
