<ol class="papers" reversed>
  {% for p in site.data.papers %}
  <li class="paper">
    <p class="paper-title">{{ p.title }}</p>
    <p class="paper-authors">{% for a in p.authors %}{% if a == "B. H. Ho" %}<strong>{{ a }}</strong>{% else %}{{ a }}{% endif %}{% unless forloop.last %}, {% endunless %}{% endfor %}</p>
    <p class="paper-venue"><em>{{ p.venue }}</em>, {{ p.year }}{% for l in p.links %} <a href="{{ l.url }}">{{ l.label }}</a>{% endfor %}</p>
  </li>
  {% endfor %}
</ol>
