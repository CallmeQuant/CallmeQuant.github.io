<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Spectral+SC:wght@500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% if page.math != false %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams',
        macros: {
          R: '\\mathbb{R}', N: '\\mathbb{N}', Z: '\\mathbb{Z}', Q: '\\mathbb{Q}',
          E: '\\mathbb{E}', P: '\\mathbb{P}',
          Var: '\\operatorname{Var}', Cov: '\\operatorname{Cov}', Corr: '\\operatorname{Corr}',
          KL: '\\operatorname{KL}', tr: '\\operatorname{tr}', diag: '\\operatorname{diag}',
          rank: '\\operatorname{rank}', sign: '\\operatorname{sign}',
          argmin: '\\operatorname*{arg\\,min}', argmax: '\\operatorname*{arg\\,max}',
          iid: '\\overset{\\text{iid}}{\\sim}',
          indep: '\\perp\\!\\!\\!\\perp',
          dd: '\\mathrm{d}',
          mleft: '\\left', mright: '\\right',
          norm: ['\\left\\lVert #1 \\right\\rVert', 1],
          abs: ['\\left\\lvert #1 \\right\\rvert', 1],
          inner: ['\\left\\langle #1, #2 \\right\\rangle', 2]
        }
      },
      options: { ignoreHtmlClass: 'no-math', processHtmlClass: 'math' },
      chtml: { scale: 0.98, matchFontHeight: true }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  {% endif %}
</head>
